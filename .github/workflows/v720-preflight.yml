name: Atrangi v7.2.0 Preflight

on:
  push:
    branches: ['feature/v720-share-icon']
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'app/**'
      - '.github/workflows/v720-preflight.yml'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate deployable package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci
          node scripts/verify-web-package.mjs
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find docs -maxdepth 1 -type f -name '*.js' -print0 | sort -z)
          python scripts/runtime-diagnostics.py --report ci/runtime-diagnostics.json
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8123 --directory docs >ci/http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 2
          python scripts/browser-acceptance.py http://127.0.0.1:8123/
      - name: Build and inspect Android APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'atrangi_riders_launcher'
          mkdir -p ci
          sha256sum "$APK" > ci/v720-apk.sha256
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atrangi-v720-preflight
          path: |
            ci/
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 7
