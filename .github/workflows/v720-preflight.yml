name: Atrangi v7.2.0 Preflight

on:
  push:
    branches: ['feature/v720-share-icon']
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'app/**'
      - '.github/workflows/v720-preflight.yml'
      - '.github/workflows/pages.yml'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate deployable package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci
          node scripts/verify-web-package.mjs
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find docs -maxdepth 1 -type f -name '*.js' -print0 | sort -z)
          python scripts/runtime-diagnostics.py --report ci/runtime-diagnostics.json
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8123 --directory docs >ci/http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 2
          python scripts/browser-acceptance.py http://127.0.0.1:8123/
      - name: Build and inspect Android APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'atrangi_riders_launcher'
          mkdir -p ci
          sha256sum "$APK" > ci/v720-apk.sha256
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atrangi-v720-preflight
          path: |
            ci/
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 7
      - name: Record preflight result
        if: always()
        shell: bash
        env:
          RESULT: ${{ job.status }}
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p ci
          python - <<'PY'
          import json,os
          from pathlib import Path
          Path('ci/v720-preflight-status.json').write_text(json.dumps({
            'status':os.environ.get('RESULT','unknown'),
            'sourceCommit':os.environ.get('SOURCE_COMMIT',''),
            'workflowRun':os.environ.get('RUN_ID',''),
            'version':'7.2.0'
          },indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/v720-preflight-status.json
          test ! -f ci/browser-acceptance.json || git add ci/browser-acceptance.json
          test ! -f ci/runtime-diagnostics.json || git add ci/runtime-diagnostics.json
          test ! -f ci/v720-apk.sha256 || git add ci/v720-apk.sha256
          git commit -m 'CI: record v7.2.0 preflight result' || exit 0
          git pull --rebase origin feature/v720-share-icon
          git push origin HEAD:feature/v720-share-icon
