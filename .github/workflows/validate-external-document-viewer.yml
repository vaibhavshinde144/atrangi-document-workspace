name: Validate External Document Viewer

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/validate-external-document-viewer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Static package and release contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci
          node scripts/verify-web-package.mjs
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find docs -maxdepth 1 -type f -name '*.js' -print0 | sort -z)
          python scripts/runtime-diagnostics.py --report ci/runtime-diagnostics.json
          python - <<'PY'
          from pathlib import Path
          import json,re
          manifest=Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          main=Path('app/src/main/java/com/atrangi/documentworkspace/MainActivity.kt').read_text(encoding='utf-8')
          gradle=Path('app/build.gradle.kts').read_text(encoding='utf-8')
          version=json.loads(Path('docs/version.json').read_text(encoding='utf-8'))
          assert 'android:launchMode="singleTop"' in manifest
          assert 'android.intent.action.VIEW' in manifest
          assert 'android.intent.action.SEND' in manifest
          assert 'android:scheme="content"' in manifest
          assert 'android:scheme="file"' in manifest
          assert 'extractExternalDocumentUri' in main
          assert 'prepareExternalDocument' in main
          assert 'readExternalDocumentChunk' in main
          assert 'markExternalDocumentConsumed' in main
          assert 'externalDocumentFailed' in main
          assert 'AtrangiWorkspaceV7' in main and 'openAsset(asset)' in main
          assert 'EXTERNAL_CHUNK_BYTES = 256 * 1024' in main
          assert 'versionCode = 7' in gradle and 'versionName = "7.2.2"' in gradle
          assert version['webVersion']=='7.2.1'
          assert version['nativeVersionCode']==7
          assert version['nativeVersionName']=='7.2.2'
          assert version['apkUrl'].endswith('/downloads/Atrangi-Document-Workspace.apk')
          print('Direct-open, privacy/cache, version and release contracts passed')
          PY

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Browser regression acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8123 --directory docs >ci/http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 2
          python scripts/browser-acceptance.py http://127.0.0.1:8123/

      - name: Android unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --no-daemon --stacktrace

      - name: Build Android 7.2.2 APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'atrangi_riders_logo'
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          sha256sum "$APK" | tee ci/app-debug.sha256
          ls -lh "$APK" | tee ci/app-debug-size.txt

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atrangi-v722-pre-release-validation
          path: |
            ci/
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
