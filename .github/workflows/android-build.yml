name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK with diagnostics
        id: gradle_build
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace --info 2>&1 | tee android-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Atrangi-Android-Build-Log
          path: android-build.log
          retention-days: 7
      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Atrangi-Document-Workspace-Android
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Summarize Android build
        if: always()
        shell: bash
        run: |
          {
            echo "### Atrangi Android build"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Gradle result: \`${{ steps.gradle_build.outcome }}\`"
            echo "- APK artifact: \`Atrangi-Document-Workspace-Android\`"
          } >> "$GITHUB_STEP_SUMMARY"
