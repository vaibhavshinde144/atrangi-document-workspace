name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK with diagnostics
        id: gradle_build
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace --info 2>&1 | tee android-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Atrangi-Android-Build-Log
          path: android-build.log
          retention-days: 7
      - name: Save failed build log to repository
        if: failure()
        shell: bash
        run: |
          mkdir -p ci
          cp android-build.log ci/android-build-last.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/android-build-last.log
          git commit -m "CI: save latest Android build failure log" || exit 0
          git push
      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Atrangi-Document-Workspace-Android
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
