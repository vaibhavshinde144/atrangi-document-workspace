name: Validate and Deploy Atrangi Workspace

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/pages.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atrangi-pages
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate exact deployable package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci
          node scripts/verify-web-package.mjs
          while IFS= read -r -d '' file; do
            echo "Syntax: $file"
            node --check "$file"
          done < <(find docs -maxdepth 1 -type f -name '*.js' -print0 | sort -z)
          python scripts/runtime-diagnostics.py --report ci/runtime-diagnostics.json
          python - <<'PY'
          from pathlib import Path
          html=Path('docs/index.html').read_text(encoding='utf-8')
          forbidden=['DecompressionStream','document.write(text)','const text=source.replace','hardCss=document.createElement']
          bad=[x for x in forbidden if x in html]
          assert not bad, f'inline bootstrap tokens in deployable index: {bad}'
          assert 'bootstrap-v719.js' in html, 'external bootstrap missing'
          print('External bootstrap WebView guard passed')
          PY

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Run real browser acceptance suite
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8123 --directory docs >ci/http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 2
          python scripts/browser-acceptance.py http://127.0.0.1:8123/

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atrangi-v719-validation
          path: |
            ci/
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Record validation and deployment result
        if: always()
        shell: bash
        env:
          DEPLOY_STATUS: ${{ job.status }}
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p ci
          export RECORDED_AT_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python - <<'PY'
          import json,os
          from pathlib import Path
          result={
            'status':os.environ.get('DEPLOY_STATUS','unknown'),
            'sourceCommit':os.environ.get('SOURCE_COMMIT',''),
            'workflowRun':os.environ.get('RUN_ID',''),
            'deployedUrl':os.environ.get('DEPLOYED_URL',''),
            'webVersion':'7.1.9',
            'deliveryMode':'external-bootstrap',
            'recordedAtUtc':os.environ.get('RECORDED_AT_UTC','')
          }
          Path('ci/pages-deploy-status.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/pages-deploy-status.json
          test ! -f ci/runtime-diagnostics.json || git add ci/runtime-diagnostics.json
          test ! -f ci/browser-acceptance.json || git add ci/browser-acceptance.json
          git commit -m 'CI: record v7.1.9 external WebView acceptance result' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
