name: Atrangi Runtime Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/runtime-diagnostics.py'
      - '.github/workflows/pages.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize logo
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          raw=Path('docs/atrangi-brand-logo.b64').read_text(encoding='utf-8-sig')
          data=''.join(raw.split())
          if data.startswith('data:image') and ',' in data:
              data=data.split(',',1)[1]
          data += '='*((4-len(data)%4)%4)
          png=base64.b64decode(data,validate=False)
          assert png.startswith(b'\x89PNG\r\n\x1a\n')
          Path('docs/atrangi-brand-logo.png').write_bytes(png)
          print('logo bytes',len(png))
          PY

      - name: Inspect static bundle
        shell: bash
        run: |
          mkdir -p ci
          python scripts/runtime-diagnostics.py --report ci/runtime-diagnostics.json
          node --check docs/branding-v716.js
          node --check docs/sw.js

      - name: Inspect rendered runtime
        shell: bash
        run: |
          set -e
          python -m http.server 8123 --directory docs >ci/http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "browser=$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=10000 --dump-dom http://127.0.0.1:8123/?ci=1 >ci/rendered-dom.html
          python scripts/runtime-diagnostics.py --report ci/runtime-diagnostics.json --rendered-dom ci/rendered-dom.html

      - name: Record diagnostic result
        if: always()
        shell: bash
        run: |
          mkdir -p ci
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('ci/runtime-diagnostics.json')
          data=json.loads(p.read_text()) if p.exists() else {}
          data['diagnosticSourceCommit']=os.environ.get('GITHUB_SHA','')
          data['diagnosticRunId']=os.environ.get('GITHUB_RUN_ID','')
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/runtime-diagnostics.json
          git commit -m 'CI: record headless runtime diagnostics' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
