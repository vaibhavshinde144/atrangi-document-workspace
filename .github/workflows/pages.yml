name: Deploy Website to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize Atrangi brand image
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/atrangi-brand-logo.b64
          base64 --decode docs/atrangi-brand-logo.b64 > docs/atrangi-brand-logo.png
          test -s docs/atrangi-brand-logo.png

      - name: Smoke check web package
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            docs/index.html \
            docs/version.json \
            docs/branding-v716.js \
            docs/branding-v716.css \
            docs/sw.js \
            docs/manifest.webmanifest \
            docs/app-00.txt \
            docs/app-01.txt \
            docs/app-02.txt \
            docs/app-03.txt \
            docs/app-04.txt \
            docs/app-05.txt \
            docs/app-06.txt; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done
          node --check docs/branding-v716.js
          node --check docs/sw.js
          node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('docs/version.json','utf8')); if(v.webVersion!=='7.1.7') throw new Error('Expected webVersion 7.1.7, got '+v.webVersion); JSON.parse(fs.readFileSync('docs/manifest.webmanifest','utf8')); console.log('Atrangi web package smoke check passed for v'+v.webVersion);"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
