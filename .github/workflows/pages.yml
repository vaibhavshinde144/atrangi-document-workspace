name: Deploy Website to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize Atrangi brand image
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/atrangi-brand-logo.b64
          python - <<'PY'
          import base64, pathlib
          src = pathlib.Path('docs/atrangi-brand-logo.b64')
          raw = src.read_text(encoding='utf-8-sig')
          compact = ''.join(raw.split())
          if compact.startswith('data:image') and ',' in compact:
              compact = compact.split(',', 1)[1]
          compact += '=' * ((4 - len(compact) % 4) % 4)
          data = base64.b64decode(compact, validate=False)
          if not data.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('Atrangi brand source did not decode to a PNG')
          pathlib.Path('docs/atrangi-brand-logo.png').write_bytes(data)
          print(f'Materialized Atrangi PNG: {len(data)} bytes')
          PY
          test -s docs/atrangi-brand-logo.png

      - name: Smoke check web package
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            docs/index.html \
            docs/version.json \
            docs/branding-v716.js \
            docs/branding-v716.css \
            docs/sw.js \
            docs/manifest.webmanifest \
            docs/atrangi-brand-logo.png \
            docs/app-00.txt \
            docs/app-01.txt \
            docs/app-02.txt \
            docs/app-03.txt \
            docs/app-04.txt \
            docs/app-05.txt \
            docs/app-06.txt; do
              test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done
          node --check docs/branding-v716.js
          node --check docs/sw.js
          node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('docs/version.json','utf8')); if(v.webVersion!=='7.1.7') throw new Error('Expected webVersion 7.1.7, got '+v.webVersion); JSON.parse(fs.readFileSync('docs/manifest.webmanifest','utf8')); const p=fs.readFileSync('docs/atrangi-brand-logo.png'); if(p.length<1000||p[0]!==0x89||p.toString('ascii',1,4)!=='PNG') throw new Error('Invalid Atrangi PNG'); console.log('Atrangi web package smoke check passed for v'+v.webVersion);"

      - name: Inspect actual bundled runtime contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci
          python - <<'PY'
          import base64,gzip,json,re
          from pathlib import Path
          docs=Path('docs')
          names=[f'app-{i:02d}.txt' for i in range(7)]
          encoded=''.join((docs/n).read_text(encoding='utf-8').strip() for n in names)
          source=gzip.decompress(base64.b64decode(encoded)).decode('utf-8','replace')
          def snippet(term,radius=1000):
              i=source.find(term)
              if i<0:return ''
              return re.sub(r'\s+',' ',source[max(0,i-radius):min(len(source),i+radius)])
          classes=re.findall(r'class=["\']([^"\']+)["\']',source,re.I)
          ids=re.findall(r'id=["\']([^"\']+)["\']',source,re.I)
          refs=re.findall(r'<(?:script|link)\b[^>]+(?:src|href)=["\']([^"\']+)["\']',source,re.I)
          report={
            'htmlBytes':len(source.encode()),
            'hasTopbar':bool(re.search(r'class=["\'][^"\']*\btopbar\b',source,re.I)),
            'hasBrandBlock':'brand-block' in source,
            'hasBrandLogo':'brand-logo' in source,
            'hasTopActions':'top-actions' in source,
            'hasHomePanel':'homePanel' in source,
            'hasDesktopNav':'desktopNav' in source,
            'hasMobileNav':'mobileNav' in source,
            'hasThemeToggleInBase':'themeToggleBtn' in source,
            'hasAtrangiPlaceholder':bool(re.search(r'>\s*A\s*<',source)),
            'assetRefs':refs,
            'ids':sorted(set(ids)),
            'classes':sorted(set(c for group in classes for c in group.split())),
            'topbarSnippet':snippet('topbar'),
            'brandSnippet':snippet('brand-block'),
            'logoSnippet':snippet('brand-logo'),
            'actionsSnippet':snippet('top-actions'),
            'homeSnippet':snippet('homePanel'),
            'titleSnippet':snippet('Atrangi Document Workspace'),
          }
          Path('ci/runtime-diagnostics.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps({k:report[k] for k in ['htmlBytes','hasTopbar','hasBrandBlock','hasBrandLogo','hasTopActions','hasHomePanel','hasDesktopNav','hasMobileNav','hasThemeToggleInBase','hasAtrangiPlaceholder']},indent=2))
          PY

      - name: Diagnostic-only gate — do not deploy yet
        shell: bash
        run: |
          echo "Runtime diagnostics captured. Deployment intentionally blocked until fixes are validated."
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record deployment result
        if: always()
        shell: bash
        env:
          DEPLOY_STATUS: ${{ job.status }}
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p ci
          export RECORDED_AT_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python - <<'PY'
          import json, os
          result = {
              "status": os.environ.get("DEPLOY_STATUS", "unknown"),
              "sourceCommit": os.environ.get("SOURCE_COMMIT", ""),
              "workflowRun": os.environ.get("RUN_ID", ""),
              "runAttempt": os.environ.get("RUN_ATTEMPT", ""),
              "deployedUrl": os.environ.get("DEPLOYED_URL", ""),
              "recordedAtUtc": os.environ.get("RECORDED_AT_UTC", "")
          }
          with open("ci/pages-deploy-status.json", "w", encoding="utf-8") as f:
              json.dump(result, f, indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/pages-deploy-status.json
          test ! -f ci/runtime-diagnostics.json || git add ci/runtime-diagnostics.json
          git commit -m "CI: record Atrangi runtime diagnostics" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
