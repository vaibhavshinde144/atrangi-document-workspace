<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atrangi Document Workspace v7.1</title></head><body><p style="font:16px system-ui;padding:24px">Loading Atrangi Document Workspace…</p><script>(async()=>{try{const names=['app-00.txt','app-01.txt','app-02.txt','app-03.txt','app-04.txt','app-05.txt','app-06.txt'];let b64='';for(const n of names)b64+=await(await fetch(n,{cache:'no-store'})).text();const raw=Uint8Array.from(atob(b64.trim()),c=>c.charCodeAt(0));const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));const text=await new Response(stream).text();document.open();document.write(text);document.close()}catch(e){document.body.innerHTML='<pre style="white-space:pre-wrap;font:14px system-ui;padding:24px">Unable to load app: '+String(e)+'</pre>'}})();</script></body></html>
