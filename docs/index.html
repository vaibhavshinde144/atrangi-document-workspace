<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="theme-color" content="#0e3b4d"><title>Atrangi Document Workspace v7.1.6</title><link rel="icon" type="image/png" href="atrangi-brand-logo.png?v=716"><style>html,body{margin:0;min-height:100%;background:#f7f9fa;color:#102630;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}#boot{padding:24px}@media(prefers-color-scheme:dark){html,body{background:#07151c;color:#edf8fb}}</style></head><body><div id="boot">Loading Atrangi Document Workspace&hellip;</div><script>(async()=>{try{const release='716';const names=['app-00.txt','app-01.txt','app-02.txt','app-03.txt','app-04.txt','app-05.txt','app-06.txt'];let b64='';for(const n of names){const r=await fetch(n+'?v='+release,{cache:'no-store'});if(!r.ok)throw new Error(n+' '+r.status);b64+=(await r.text()).trim()}const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));const source=await new Response(stream).text();const text=source.replace(/(<(?:link|script)\b[^>]+(?:href|src)=")([^"]+)(")/gi,(all,start,url,end)=>start+url+(url.includes('?')?'&':'?')+'v='+release+end);const parsed=new DOMParser().parseFromString(text,'text/html');const css=[...parsed.querySelectorAll('style')].map(s=>s.textContent||'').join('\n')+'\nhtml{-webkit-text-size-adjust:100%!important;text-size-adjust:100%!important;}';document.open();document.write(text);document.close();const repair=document.createElement('style');repair.id='atrangi-webview-style-repair';repair.textContent=css;document.head.appendChild(repair);for(const href of ['hardening-v715.css','branding-v716.css']){const l=document.createElement('link');l.rel='stylesheet';l.href=href+'?v='+release;document.head.appendChild(l)}for(const src of ['hardening-v715.js','branding-v716.js']){const s=document.createElement('script');s.src=src+'?v='+release;document.body.appendChild(s)}document.title='Atrangi Document Workspace v7.1.6';document.documentElement.style.webkitTextSizeAdjust='100%';document.documentElement.style.textSizeAdjust='100%';requestAnimationFrame(()=>{window.dispatchEvent(new Event('resize'));window.scrollTo(0,0)});}catch(e){document.body.innerHTML='<pre style="white-space:pre-wrap;font:14px system-ui;padding:24px">Unable to load app: '+String(e)+'</pre>'}})();</script></body></html>
